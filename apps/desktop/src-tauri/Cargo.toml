[package]
name = "jarvis-desktop"
version = "0.2.5"
edition = "2021"

[lib]
name = "jarvis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-process = "2"
tauri-plugin-notification = "2"

tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
base64 = "0.22"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
xcap = "0.9"

[target."cfg(windows)".dependencies]
tauri-winrt-notification = "0.8"
enigo = "0.6"
uiautomation = "0.25"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
