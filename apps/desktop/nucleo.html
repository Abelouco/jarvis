<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laboratório do núcleo</title>
    <style>
      html, body { margin: 0; height: 100%; background: #04060b; color: #9db0c6; font: 13px system-ui, sans-serif; }
      #caixa { position: fixed; inset: 0; }
      #dica { position: fixed; left: 16px; bottom: 14px; font-family: Consolas, monospace; letter-spacing: .08em; }
    </style>
  </head>
  <body>
    <div id="caixa"></div>
    <p id="dica">LABORATÓRIO · clique ou espaço = pulso</p>
    <script type="module">
      import { montarNucleo } from '/src/nucleo3d.ts';
      const n = montarNucleo(document.getElementById('caixa'));
      window.pulsar = (f) => n.pulsar(f);
      addEventListener('click', () => n.pulsar());
      addEventListener('keydown', (e) => e.code === 'Space' && n.pulsar());
    </script>
  </body>
</html>
