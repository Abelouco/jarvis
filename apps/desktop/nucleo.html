<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laboratório do núcleo</title>
    <style>
      html, body { margin: 0; height: 100%; background: #04060b; color: #9db0c6; font: 13px system-ui, sans-serif; }
      #caixa { position: fixed; inset: 0; }
      #dica { position: fixed; left: 16px; bottom: 14px; font-family: Consolas, monospace; letter-spacing: .08em; }
    </style>
  </head>
  <body>
    <div id="caixa"></div>
    <p id="dica">LABORATÓRIO · arraste = girar · espaço = pulso · 1 repouso · 2 pensando · 3 agindo · 4 permissão · 5 erro · C criado · A apagado</p>
    <script type="module">
      import { montarNucleo } from '/src/nucleo3d.ts';
      const n = montarNucleo(document.getElementById('caixa'));
      window.pulsar = (f, tom) => n.pulsar(f, tom);
      window.estado = (e) => n.definirEstado(e);
      const ESTADOS = { Digit1: 'repouso', Digit2: 'pensando', Digit3: 'agindo', Digit4: 'permissao', Digit5: 'erro' };
      addEventListener('keydown', (e) => {
        if (e.code === 'Space') n.pulsar();
        if (ESTADOS[e.code]) n.definirEstado(ESTADOS[e.code]);
        if (e.code === 'KeyC') n.pulsar(0.9, 'criado');
        if (e.code === 'KeyA') n.pulsar(1, 'apagado');
      });
    </script>
  </body>
</html>
