# Instalador do Windows + auto-update.
# Roda quando uma tag vX.Y.Z é enviada (use `pnpm release:pc X.Y.Z`).
# Gera o .exe (NSIS) assinado para o updater e publica no GitHub Releases com o latest.json.
name: Release PC

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Instalar dependências (só o app do PC)
        run: pnpm install --frozen-lockfile --filter "@jarvis/desktop..."

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: v__VERSION__
          releaseName: 'J.A.R.V.I.S. PC v__VERSION__'
          releaseBody: 'Instale o arquivo .exe. Depois disso o app se atualiza sozinho.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
